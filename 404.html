<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script>
    // 获取当前 URL
    const currentUrl = window.location.href;
    // 定义正确的大写 URL
    const correctUrl = 'https://vain222.github.io/TENT/';
    // 检查当前 URL 是否包含小写的 tent
    if (currentUrl.includes('tent')) {
      // 替换为大写的 TENT
      const newUrl = currentUrl.replace('tent', 'TENT');
      // 重定向到正确的 URL
      window.location.href = newUrl;
    } else {
      // 如果不是小写 tent 相关问题，重定向到默认页面
      window.location.href = correctUrl;
    }
  </script>
</head>
<body>
  <p>Redirecting to <a href="https://vain222.github.io/TENT/">https://vain222.github.io/TENT/</a>...</p>
</body>
</html>
