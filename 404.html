<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting to TENT...</title>
    <script>
        (function() {
            // 项目正确的大写路径
            const correctBasePath = '/TENT/';
            
            // 获取当前路径并转换为小写用于比较
            const currentPath = window.location.pathname;
            const lowerPath = currentPath.toLowerCase();
            
            // 检查是否匹配项目路径（不区分大小写）
            if (lowerPath.startsWith('/tent/')) {
                // 提取路径中小写版本之后的部分
                const remainingPath = currentPath.substring(5);
                
                // 构建正确的大写URL
                const newUrl = window.location.origin + 
                              correctBasePath + 
                              remainingPath + 
                              window.location.search + 
                              window.location.hash;
                
                // 永久重定向（301）
                window.location.replace(newUrl);
            } else {
                // 显示404页面
                document.getElementById('404-content').style.display = 'block';
            }
        })();
    </script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #333; }
        p { color: #666; }
        #404-content { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <noscript>
            <h1>JavaScript Required</h1>
            <p>Please enable JavaScript to be redirected to the correct page.</p>
            <p>Or visit the main page: 
                <a href="https://vain222.github.io/TENT/">https://vain222.github.io/TENT/</a>
            </p>
        </noscript>
        
        <div id="404-content">
            <h1>Page Not Found</h1>
            <p>The requested page could not be found.</p>
            <p>Visit the main page: 
                <a href="https://vain222.github.io/TENT/">https://vain222.github.io/TENT/</a>
            </p>
        </div>
    </div>
</body>
</html>
